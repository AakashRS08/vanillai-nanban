server:
  port: ${PORT:8080}

spring:
  application:
    name: vanillai-nanban
  # Default: in-memory H2 (MySQL mode) so the app runs with zero setup.
  # Use SPRING_PROFILES_ACTIVE=mysql for the real SQL database (docker-compose does this).
  datasource:
    url: jdbc:h2:mem:nanban;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

nanban:
  jwt:
    # MUST be overridden in production (min 32 chars). Set NANBAN_JWT_SECRET.
    secret: ${NANBAN_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiry-minutes: ${NANBAN_JWT_EXPIRY_MINUTES:720}
  cors-origins: ${NANBAN_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin-emails: ${NANBAN_ADMIN_EMAILS:}
  weather:
    geocoding-url: https://geocoding-api.open-meteo.com
    forecast-url: https://api.open-meteo.com
    air-url: https://air-quality-api.open-meteo.com
    cache-ttl-seconds: ${NANBAN_WEATHER_CACHE_TTL:600}
    history-days: 7
    collect-interval-ms: ${NANBAN_COLLECT_INTERVAL_MS:3600000}
  prediction:
    ml-url: ${NANBAN_ML_URL:http://localhost:8000}
    horizons: 3,6,9,12,18,24,36,48
    timeout-ms: 8000
  chat:
    # LLM key is read from the environment, never from source code.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${NANBAN_CHAT_MODEL:claude-haiku-5-5}
    api-url: https://api.anthropic.com/v1/messages
    max-history-turns: 6

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nanban}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:nanban}
    password: ${DB_PASSWORD:nanban}
